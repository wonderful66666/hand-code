name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.1'
      - name: Verify both Spring Boot services
        run: mvn -B -ntp -Dmaven.repo.local="$PWD/.cache/maven" verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/rust-target
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Rust 1.93.0
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.93.0 fmt --manifest-path WithYourHandRust/Cargo.toml --check
      - run: cargo +1.93.0 clippy --manifest-path WithYourHandRust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.93.0 test --manifest-path WithYourHandRust/Cargo.toml --locked
