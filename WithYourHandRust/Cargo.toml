[package]
name = "with-your-hand-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5.3", features = ["util"] }
